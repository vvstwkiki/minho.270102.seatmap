<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINHO 台北場座位圖</title>
<style>
:root{--bg:#f4f5f8;--ink:#1d2030;--mute:#7b8094;--panel:#fff;--line:#d7dae4;--stage:#cfd1d8;--vip:#2f8fe6;--a:#5a65c9;--b:#35b5ad;--c:#bb4a78;--hit:#ffd23f;--s:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--ink:#e9ebf3;--mute:#8c92a8;--panel:#1d2030;--line:#343850;--stage:#3a3d4d;--vip:#2674c0;--a:#4a54ad;--b:#2a948d;--c:#9c3d63}}
:root[data-theme="dark"]{--bg:#14161f;--ink:#e9ebf3;--mute:#8c92a8;--panel:#1d2030;--line:#343850;--stage:#3a3d4d;--vip:#2674c0;--a:#4a54ad;--b:#2a948d;--c:#9c3d63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 14px}
h1{font-size:15px;margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:80px;max-width:140px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--hit);outline-offset:1px}
button{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
button.go{background:var(--hit);border-color:var(--hit);color:#222;font-weight:600}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
#res{font-size:14px;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
#res span{padding:2px 10px;border-radius:99px;background:var(--hit);color:#222}
#res span.bad{background:#c0493b;color:#fff}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#wrap{overflow:auto;height:calc(100vh - 190px);min-height:420px;padding:20px}
#map{width:max-content;margin:0 auto}
.stage{background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(var(--s)*5);text-align:center;border-radius:4px;margin:0 auto calc(var(--s)*3);width:55%;overflow:hidden}
.stage b{font-size:max(9px,calc(var(--s)*1.5));letter-spacing:2px;line-height:1.2;display:block}
.stage small{color:var(--mute);font-size:max(6px,calc(var(--s)*.5))}
.sm .stage small{display:none}
.r{display:flex;align-items:center;height:var(--s)}
.lb{width:22px;text-align:center;font-size:11px;color:var(--mute)}
.s,.e{width:var(--s);height:var(--s);flex:none}
.s{border:1px solid var(--bg);color:#fff;font-size:calc(var(--s)*.4);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.zVIP{background:var(--vip)}.zA{background:var(--a)}.zB{background:var(--b)}.zC{background:var(--c)}
.s.hit{background:var(--hit);color:#222;font-weight:700;outline:2px solid var(--hit);outline-offset:1px;position:relative;z-index:1}
.ai{width:calc(var(--s)*4);height:var(--s);flex:none;text-align:center;font-size:11px;line-height:var(--s);color:var(--mute)}
.ai.st,.ai.foh{background:var(--stage)}
.e.g{background:var(--stage)}
.gap{margin-top:calc(var(--s)*1.3)}
.ai{position:relative}
.sl{position:absolute;z-index:2;left:0;right:0;top:100%;transform:translateY(-50%);line-height:var(--s);color:var(--ink);font-weight:600;white-space:nowrap}
#wrap{padding-bottom:230px}
#cmp{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-height:45vh;overflow:auto;font-size:14px}
#cmp.on{display:block}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ct{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child{text-align:left;color:var(--mute);font-weight:400}
.cn{font-size:13px;color:var(--mute);margin-top:6px}
.s[data-t]{color:#fff;font-weight:700;outline:2px solid;outline-offset:1px;position:relative;z-index:1}
.s[data-t=A],.tA{background:#ff7a1a;outline-color:#ff7a1a;color:#fff}
.s[data-t=B],.tB{background:#8b4fe8;outline-color:#8b4fe8;color:#fff}
.s[data-t=C],.tC{background:#e8368a;outline-color:#e8368a;color:#fff}
.s[data-t=D],.tD{background:#12a150;outline-color:#12a150;color:#fff}
html{height:100dvh}
body{display:flex;flex-direction:column;height:100%}
header{flex:none}
#wrap{flex:1;min-height:0;height:auto;padding:16px 12px 230px}
.sm .s{border-width:0;box-shadow:inset 0 0 0 .5px var(--bg)}
.sm .lb{width:12px;font-size:7px;line-height:1}
.sm .lb:not(.k5){visibility:hidden}
.sm .ai,.sm .sl{font-size:5px}
.sm .s.hit,.sm .s[data-t]{outline-width:3px;z-index:2;box-shadow:none}
.mo{display:none}
button,input{touch-action:manipulation}
.sm .s{color:transparent}
.sm .s[data-t]{color:#fff}
@media (max-width:600px){
 header{padding:8px 10px}
 h1{font-size:14px;margin-bottom:6px}
 .row{gap:6px}
 input{min-width:0;flex:1 1 60px;padding:8px}
 button{padding:8px 10px;font-size:14px}
 .mo{display:inline-block}
 .hint{display:none;font-size:12px;line-height:1.4}
 .hint.open{display:block}
 .lg{gap:8px;font-size:12px;margin-top:6px}
 #cmp{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));max-height:42vh;font-size:13px}
 th,td{padding:3px 6px}
}
#map:not(.sinf) .s.inf{visibility:hidden;pointer-events:none}
.s.inf{opacity:1}
.tg{font-size:13px;display:flex;align-items:center;gap:4px;color:var(--mute);white-space:nowrap}
.tg input{flex:none;min-width:0;max-width:none;padding:0}
.n{font-style:normal;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>MINHO 台北場座位圖（2027/01/02 台大體育館）</h1>
  <div class="row">
    <input id="qr" type="number" inputmode="numeric" min="1" max="33" placeholder="排數" aria-label="排數" autocomplete="off">
    <input id="qs" type="number" inputmode="numeric" min="1" max="76" placeholder="座號" aria-label="座號" autocomplete="off">
    <button class="go" id="go">找座位</button>
    <button id="add">加入比較</button>
    <button id="clr">清除</button>
    <button id="zo" aria-label="縮小">－</button>
    <button id="zi" aria-label="放大">＋</button>
    <button id="fit">全覽</button>
    <button id="hb" class="mo">說明</button>
  </div>
  <div class="hint">點座位或按「加入比較」，最多可同時比較 4 個座位。<br>單號在左、雙號在右，越靠中間號碼越小。座位僅供參考，實際依現場為主。<br>@vvs.tw.kiki</div>
  <div class="lg"><span><i style="background:var(--vip)"></i>VIP 6200 <em class="n" data-z="VIP"></em></span><span><i style="background:var(--a)"></i>A 5800 <em class="n" data-z="A"></em></span><span><i style="background:var(--b)"></i>B 4800 <em class="n" data-z="B"></em></span><span><i style="background:var(--c)"></i>C 3800 <em class="n" data-z="C"></em></span></div>
  <div id="res"></div>
</header>
<div id="wrap"><div id="map"></div></div>
<div id="cmp"></div>
<script>
const pad=n=>String(n).padStart(2,'0');
// 依官方示意圖：c 為從中間數來第幾個座位（1~35）
// 排 1–8：VIP 上方寬區 c1–20，A 區斜角 c21 起；排 9–16：VIP 窄條 c7–13、小舞台 c1–6、A c14+；排 17–24：VIP c1–13、A c14+；排 25–31：B；排 32–34：C c18+、FOH c1–14
function zone(r,n){
  const c=n%2?(n+1)/2:n/2;
  if(r<=9)return c<=22?'VIP':(c<=23+Math.round((r-1)*15/8)?'A':null);
  if(r<=17)return c>=8&&c<=12?'VIP':(c>=13?'A':null);
  if(r<=25)return c<=12?'VIP':'A';
  if(r<=29)return 'B';
  return c>=20?'C':null;
}
// 回報資料（區 排 號）：表單 99 筆 + 選位截圖，共 169 筆不重複。有新資料從這裡加即可
const DATA='A1 7 51;A1 7 67;A1 9 59;A1 9 61;A1 9 63;A1 12 31;A1 12 33;A1 13 39;A1 13 59;A1 13 61;A1 13 73;A1 13 75;A2 4 48;A2 6 48;A2 7 54;A2 8 46;A2 8 64;A2 8 66;A2 9 48;A2 9 60;A2 10 44;A2 11 72;A2 11 74;B1 26 15;B1 26 31;B1 26 41;B1 26 55;B1 27 73;B1 27 75;B2 26 2;B2 26 4;B2 26 8;B2 26 10;B2 26 12;B2 26 14;B2 26 28;B2 26 64;B2 27 26;B2 27 38;B2 27 40;B2 27 46;B2 27 48;C1 30 43;C1 30 49;C1 30 53;C1 30 55;C1 30 75;C1 31 65;C1 32 65;C1 32 67;C1 32 69;C1 32 71;C2 30 54;C2 30 56;C2 31 66;C2 31 68;C2 31 70;C2 32 40;VIP1 1 9;VIP1 1 11;VIP1 1 15;VIP1 3 5;VIP1 3 7;VIP1 3 9;VIP1 3 25;VIP1 3 27;VIP1 4 27;VIP1 4 31;VIP1 4 33;VIP1 4 39;VIP1 5 35;VIP1 5 41;VIP1 5 43;VIP1 7 41;VIP1 8 7;VIP1 8 9;VIP1 8 17;VIP1 9 7;VIP1 9 23;VIP1 9 31;VIP1 12 23;VIP1 14 15;VIP1 15 15;VIP1 18 1;VIP1 19 1;VIP1 19 3;VIP1 19 5;VIP1 19 7;VIP1 19 13;VIP1 20 13;VIP1 20 15;VIP1 21 19;VIP1 22 5;VIP1 22 9;VIP1 23 3;VIP1 23 13;VIP1 23 15;VIP1 24 13;VIP1 25 19;VIP2 1 8;VIP2 2 8;VIP2 2 26;VIP2 2 28;VIP2 3 40;VIP2 3 42;VIP2 4 26;VIP2 4 44;VIP2 5 28;VIP2 5 30;VIP2 6 16;VIP2 7 16;VIP2 7 20;VIP2 8 12;VIP2 8 16;VIP2 9 12;VIP2 9 40;VIP2 9 44;VIP2 10 16;VIP2 10 18;VIP2 11 16;VIP2 11 18;VIP2 11 20;VIP2 13 24;VIP2 16 16;VIP2 17 16;VIP2 17 22;VIP2 18 2;VIP2 18 18;VIP2 18 22;VIP2 18 24;VIP2 19 14;VIP2 20 10;VIP2 20 12;VIP2 20 20;VIP2 20 22;VIP2 22 10;VIP2 22 18;VIP2 22 20;VIP2 22 22;VIP2 22 24;VIP2 23 14;VIP2 24 2;VIP2 24 4;VIP2 24 12;VIP2 25 12;VIP2 25 14;VIP2 25 20;VIP1 25 11;VIP2 4 12;VIP2 8 14;VIP2 2 12;VIP2 10 22;VIP2 10 20;VIP1 22 13;VIP1 4 13;VIP1 4 15;VIP2 7 26;VIP2 5 22;VIP2 9 20;A1 10 53;A1 3 49;A2 11 36;A1 11 65;A2 10 74;VIP1 24 17;VIP2 17 20;A2 9 54;VIP2 8 4;VIP2 21 24';
const RG={};
DATA.split(';').forEach(t=>{const [z,r,s]=t.split(' '),k=z+'|'+r,v=+s,g=RG[k]||(RG[k]=[v,v]);g[0]=Math.min(g[0],v);g[1]=Math.max(g[1],v)});
function zoneD(r,n){const sd=n%2?1:2;for(const b of ['VIP','A','B','C']){const g=RG[b+sd+'|'+r];if(g&&n>=g[0]&&n<=g[1])return b}return null}
const cell=(r,n)=>{
  const zr=zoneD(r,n),z=zr||zone(r,n),inf=!zr&&z;
  if(!z){const k=n%2?(n+1)/2:n/2;return '<div class="e'+((false||(r>=30&&k<=15))?' g':'')+'"></div>'}
  const nm=z+(n%2?1:2)+' 區';const m=n;
  return '<div class="s z'+z+(inf?' inf':'')+'" data-n="'+n+'" data-k="'+pad(r)+'-'+pad(m)+'" data-z="'+nm+'" title="'+nm+' '+r+' 排 '+m+' 號">'+pad(m)+'</div>';
};
let h='<div class="stage"><small>MINHO CONCERT MEAN:of FERAL in TAIPEI</small><b>STAGE</b></div>';
const ROWS=[...Array(33).keys()].map(i=>i+1);
for(const r of ROWS){
  h+='<div class="r'+(r===26||r===30?' gap':'')+'"><span class="lb'+(r%5===0||r===1?' k5':'')+'">'+pad(r)+'</span>';
  for(let n=75;n>=1;n-=2)h+=cell(r,n);
  const c=r>=12&&r<=15?'st':r>=30?'foh':'';
  h+='<div class="ai '+c+'">'+(r===13?'<span class="sl">小舞台</span>':r===31?'<span class="sl">FOH</span>':'')+'</div>';
  for(let n=2;n<=76;n+=2)h+=cell(r,n);
  h+='<span class="lb'+(r%5===0||r===1?' k5':'')+'">'+pad(r)+'</span></div>';
}
const map=document.getElementById('map');
map.innerHTML=h;
document.querySelectorAll('.n').forEach(e=>{e.textContent='約 '+map.querySelectorAll('.s.z'+e.dataset.z).length+' 個'+(e.dataset.z==='C'?'（推估）':'')});
const res=document.getElementById('res'),qr=document.getElementById('qr'),qs=document.getElementById('qs');
function clearAll(){document.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));res.innerHTML=''}
function find(){
  clearAll();
  const r=+qr.value,n=+qs.value;
  const el=r&&n&&sel(pad(r)+'-'+pad(n));
  const sp=document.createElement('span');
  if(el){el.classList.add('hit');sp.textContent=el.dataset.z+' '+r+' 排 '+n+' 號';el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}
  else{sp.className='bad';sp.textContent=(r&&n)?'沒有第 '+r+' 排 '+n+' 號這個座位':'請輸入排數和座號'}
  res.appendChild(sp);
}
const sel=k=>map.querySelector('[data-k="'+k+'"]'+(map.classList.contains('sinf')?'':':not(.inf)'));
map.classList.add('sinf');
document.getElementById('go').onclick=find;
[qr,qs].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')find()}));
document.getElementById('clr').onclick=()=>{qr.value='';qs.value='';clearAll();qr.focus()};
const TAG=['A','B','C','D'],PRICE={VIP:6200,A:5800,B:4800,C:3800},list=[],cp=document.getElementById('cmp');
function say(t){res.innerHTML='';const sp=document.createElement('span');sp.className='bad';sp.textContent=t;res.appendChild(sp)}
function toggle(el,addOnly){
  const i=list.indexOf(el);
  if(i>=0){if(addOnly)return;list.splice(i,1)}
  else{if(list.length>=4){say('最多同時比較 4 個座位');return}list.push(el)}
  draw();
}
function info(el){const n=+el.dataset.n,k=el.dataset.k,z=el.dataset.z.replace(/\d 區/,''),r=+k.slice(0,2),c=n%2?(n+1)/2:n/2,dx=c+1.5,dy=r-12.5;return{r,m:+k.slice(3),c,left:n%2===1,z:el.dataset.z,p:PRICE[z],f:r<=9?'背面':r>=18?'正面':'側面（'+(n%2?'左':'右')+'）'}}
function draw(){
  document.querySelectorAll('.s[data-t]').forEach(e=>{delete e.dataset.t;e.textContent=e.dataset.k.slice(3)});
  list.forEach((e,i)=>{e.dataset.t=TAG[i];e.textContent=TAG[i]});
  if(!list.length){cp.className='';cp.innerHTML='';return}
  const d=list.map(info),R=d.map(x=>x.r),C=d.map(x=>x.c);
  const r0=Math.min(...R),r1=Math.max(...R),c0=Math.min(...C),c1=Math.max(...C),fr=x=>x.f==='正面'?3:x.f==='背面'?1:2,F=d.map(fr),f0=Math.min(...F),f1=Math.max(...F);
  const row=(t,f)=>'<tr><th>'+t+'</th>'+d.map(x=>'<td>'+f(x)+'</td>').join('')+'</tr>';
  const notes=[];
  for(let i=0;i<d.length;i++)for(let j=i+1;j<d.length;j++){const a=d[i],b=d[j];if(a.r===b.r)notes.push(TAG[i]+'、'+TAG[j]+(Math.abs(a.m-b.m)===2&&a.left===b.left&&a.z===b.z?' 是相鄰座位':' 在同一排'))}
  cp.className='on';
  cp.innerHTML='<div class="ch"><b>座位比較</b><button id="cc">清除比較</button></div><div class="ct"><table><tr><th></th>'+d.map((x,i)=>'<th class="t'+TAG[i]+'">'+TAG[i]+'</th>').join('')+'</tr>'+
    row('區域',x=>x.z)+row('票價',x=>'NT$'+x.p)+row('排數',x=>x.r+' 排'+(r0<r1&&x.r===r0?' ✓':''))+row('看小舞台',x=>x.f+(f0<f1&&fr(x)===f1?' ✓':''))+row('座號',x=>x.m+' 號')+row('方位',x=>x.left?'左側':'右側')+
    row('離中線',x=>(x.c===1?'緊鄰走道':(x.c-1)+' 個座位')+(c0<c1&&x.c===c0?' ✓':''))+'</table></div>'+
    (notes.length?'<div class="cn">'+notes.join('；')+'</div>':'')+'<div class="cn">✓ 代表較前面、較靠近中線，或看小舞台的面向較好（正面＞側面＞背面）。看小舞台的面向：第 1–9 排為背面、第 10–17 排為側面、第 18 排以後為正面，是假設小舞台正面朝向後方估算，僅供參考。</div>';
  document.getElementById('cc').onclick=()=>{list.length=0;draw()};
}
map.addEventListener('click',e=>{const s=e.target.closest('.s');if(s)toggle(s)});
document.getElementById('add').onclick=()=>{
  find();
  const el=sel(pad(+qr.value)+'-'+pad(+qs.value));
  if(el)toggle(el,true);
};
let c=20;
function setS(v){c=Math.min(40,Math.max(3,v));document.documentElement.style.setProperty('--s',c+'px');document.documentElement.classList.toggle('sm',c<12)}
function zoom(d){setS(c*(d>0?1.4:1/1.4))}
document.getElementById('zi').onclick=()=>{manual=true;zoom(4)};
document.getElementById('zo').onclick=()=>{manual=true;zoom(-4)};
document.getElementById('fit').onclick=()=>{manual=false;fit()};
document.getElementById('hb').onclick=()=>document.querySelector('.hint').classList.toggle('open');
let manual=false;
function fit(){const W=document.getElementById('wrap').clientWidth-24;let s=(W-44)/80;if(s<12)s=(W-24)/80;setS(Math.floor(s*10)/10)}
if(innerWidth<700)fit();
addEventListener('resize',()=>{if(manual)return;innerWidth<700?fit():setS(20)});
</script>
</body>
</html>
